<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIDAR AWS Banner Editor</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#eef3f7;color:#151333;font-family:Tahoma,"Noto Sans Arabic",Arial,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:24px}
  h1{margin:0 0 6px;font-size:25px}
  .sub{margin:0 0 22px;color:#666}
  .grid{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start}
  .panel{background:#fff;border-radius:16px;padding:20px;box-shadow:0 8px 30px #00000012}
  label{display:block;font-weight:700;margin:14px 0 7px}
  input,select{width:100%;padding:11px 12px;border:1px solid #d8dbe5;border-radius:9px;font-size:16px;font-family:inherit}
  input{direction:rtl}
  button{border:0;border-radius:9px;padding:11px 14px;font:700 15px Tahoma,"Noto Sans Arabic",sans-serif;cursor:pointer}
  .primary{background:#151333;color:#fff;width:100%;margin-top:18px}
  .secondary{background:#e9eaf1;color:#151333}
  .downloads{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .downloads button{background:#e8f5f8}
  .preview{display:flex;justify-content:center;align-items:center;background:#dfe8ec;border-radius:16px;padding:20px;min-height:620px}
  canvas{max-width:100%;height:auto;box-shadow:0 10px 35px #0003}
  .hint{font-size:12px;line-height:1.7;color:#777;margin-top:14px}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  @media(max-width:850px){.grid{grid-template-columns:1fr}.preview{min-height:0}}
</style>
</head>
<body>
<div class="wrap">
  <h1>ویرایشگر بنر AWS — BIDAR</h1>
  <p class="sub">فقط شماره جلسه، تاریخ و ساعت را تغییر بده و PNG را در اندازه دلخواه خروجی بگیر.</p>

  <div class="grid">
    <section class="panel">
      <label for="session">شماره جلسه به حروف</label>
      <input id="session" value="نوزدهم" autocomplete="off">

      <label for="date">تاریخ</label>
      <input id="date" value="پنجشنبه ۳ آگوست" autocomplete="off">

      <label for="time">ساعت</label>
      <input id="time" value="18:30" dir="ltr" autocomplete="off">

      <button class="primary" id="save">ذخیره در مرورگر و به‌روزرسانی</button>

      <label for="size">اندازه خروجی</label>
      <select id="size">
        <option value="555">555 × 554 — اندازه اصلی</option>
        <option value="1080" selected>1080 × 1078 — مناسب شبکه‌های اجتماعی</option>
        <option value="1500">1500 × 1497</option>
        <option value="2000">2000 × 1996</option>
      </select>
      <button class="primary" id="download">دانلود PNG</button>

      <div class="downloads">
        <button data-size="555">PNG 555</button>
        <button data-size="1080">PNG 1080</button>
        <button data-size="1500">PNG 1500</button>
        <button data-size="2000">PNG 2000</button>
      </div>

      <p class="hint">
        این سایت کاملاً استاتیک است و روی GitHub Pages اجرا می‌شود؛ سرور یا دیتابیس لازم ندارد.
        اطلاعات ذخیره‌شده فقط در مرورگر شما نگه داشته می‌شود.
      </p>
    </section>

    <section class="preview">
      <canvas id="canvas" width="555" height="554"></canvas>
    </section>
  </div>
</div>

<script>
const BASE_W = 555, BASE_H = 554;
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const img = new Image();

const sessionEl = document.getElementById("session");
const dateEl = document.getElementById("date");
const timeEl = document.getElementById("time");

function loadSaved(){
  try{
    const d = JSON.parse(localStorage.getItem("bidarAwsBanner") || "{}");
    if(d.session) sessionEl.value=d.session;
    if(d.date) dateEl.value=d.date;
    if(d.time) timeEl.value=d.time;
  }catch(e){}
}

function roundedRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function fitTwoLines(text, maxWidth, font){
  ctx.font = font;
  if(ctx.measureText(text).width <= maxWidth) return [text];
  const parts = text.trim().split(/\s+/);
  if(parts.length < 2) return [text];
  const lines = ["", ""];
  for(const p of parts){
    const candidate = lines[0] ? lines[0] + " " + p : p;
    if(ctx.measureText(candidate).width <= maxWidth) lines[0]=candidate;
    else lines[1] += (lines[1] ? " " : "") + p;
  }
  return lines;
}

function draw(){
  if(!img.complete) return;
  ctx.clearRect(0,0,BASE_W,BASE_H);
  ctx.drawImage(img,0,0,BASE_W,BASE_H);

  // Repaint the editable dark box so the old session/date/time disappear.
  ctx.fillStyle="#151333";
  roundedRect(ctx,63,358,267,94,7);
  ctx.fill();

  ctx.fillStyle="#fff";
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  // Left column: session number + time
  ctx.font='700 19px "Noto Sans Arabic", Tahoma, Arial, sans-serif';
  ctx.fillText(sessionEl.value,143,380);

  ctx.font='700 18px "Noto Sans Arabic", Tahoma, Arial, sans-serif';
  ctx.fillText("ساعت",143,405);

  ctx.font='700 18px Tahoma, Arial, sans-serif';
  ctx.fillText(timeEl.value,143,431);

  // Right column: session/date
  ctx.font='700 18px "Noto Sans Arabic", Tahoma, Arial, sans-serif';
  ctx.fillText("جلسه",266,380);

  const dateLines = fitTwoLines(
    dateEl.value,
    120,
    '700 17px "Noto Sans Arabic", Tahoma, Arial, sans-serif'
  );
  if(dateLines.length===1){
    ctx.font='700 17px "Noto Sans Arabic", Tahoma, Arial, sans-serif';
    ctx.fillText(dateLines[0],266,407);
  }else{
    ctx.font='700 16px "Noto Sans Arabic", Tahoma, Arial, sans-serif';
    ctx.fillText(dateLines[0],266,402);
    ctx.fillText(dateLines[1],266,430);
  }
}

function save(){
  localStorage.setItem("bidarAwsBanner", JSON.stringify({
    session:sessionEl.value,
    date:dateEl.value,
    time:timeEl.value
  }));
  draw();
}

async function downloadPNG(size){
  const targetW = Number(size);
  const scale = targetW / BASE_W;
  const targetH = Math.round(BASE_H * scale);
  const out = document.createElement("canvas");
  out.width=targetW; out.height=targetH;
  const octx=out.getContext("2d");
  octx.drawImage(canvas,0,0,targetW,targetH);
  const link=document.createElement("a");
  link.download=`BIDAR-AWS-${sessionEl.value || "session"}-${targetW}px.png`;
  link.href=out.toDataURL("image/png");
  link.click();
}

document.getElementById("save").addEventListener("click",save);
document.getElementById("download").addEventListener("click",()=>downloadPNG(document.getElementById("size").value));
document.querySelectorAll("[data-size]").forEach(b=>b.addEventListener("click",()=>downloadPNG(b.dataset.size)));
[sessionEl,dateEl,timeEl].forEach(el=>el.addEventListener("input",draw));

img.onload=()=>{ loadSaved(); draw(); };
img.src="banner-source.png";
</script>
</body>
</html>
